name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    name: Verify (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.1 --activate
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Boundaries
        run: pnpm boundaries
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Smoke
        run: pnpm smoke

  docker:
    name: Docker image smoke
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Enable pnpm tooling for smoke script
        run: |
          corepack enable
          corepack prepare pnpm@10.15.1 --activate
      - name: Compute tags
        id: meta
        run: |
          echo "version=0.1.0" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
      - name: Build image
        run: |
          IMAGE=agentforge/platform-host
          VERSION=${{ steps.meta.outputs.version }}
          SHA=${{ steps.meta.outputs.short_sha }}
          docker build \
            -t "$IMAGE:$VERSION" \
            -t "$IMAGE:$VERSION-$SHA" \
            -t "$IMAGE:sha-$SHA" \
            .
          if [ "${{ github.ref }}" = "refs/heads/main" ] || [ "${{ github.ref }}" = "refs/heads/master" ]; then
            docker tag "$IMAGE:$VERSION-$SHA" "$IMAGE:latest"
          fi
      - name: Run container
        run: |
          docker run --rm -d --name agentforge-ci \
            -p 3000:3000 \
            -e HOST=0.0.0.0 \
            -e PORT=3000 \
            -e LOG_LEVEL=error \
            -e REFERENCE_AGENT_ENABLED=true \
            agentforge/platform-host:0.1.0
      - name: Docker smoke
        run: node scripts/docker-smoke.mjs http://127.0.0.1:3000
      - name: Stop container
        if: always()
        run: docker stop agentforge-ci || true
