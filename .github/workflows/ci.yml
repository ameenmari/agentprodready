      - name: Evaluation persistence PostgreSQL tests
        run: pnpm test:evaluation-persistence

  vector-search-postgres:
    name: Vector Search PostgreSQL
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: agentprodready_ci
          POSTGRES_PASSWORD: agentprodready_ci
          POSTGRES_DB: agentprodready_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentprodready_ci -d agentprodready_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://agentprodready_ci:agentprodready_ci@127.0.0.1:5432/agentprodready_ci
      RUN_POSTGRES_TESTS: "1"
      VECTOR_INDEX_PROFILE: reference-32
      VECTOR_SEARCH_ENABLED: "true"
      VECTOR_STORE_PROVIDER: pgvector
      EMBEDDING_PROVIDER: reference
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.1 --activate
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Migrate persistence
        run: pnpm db:migrate
      - name: Migrate vector index
        run: pnpm db:migrate:vector
      - name: Vector search tests
        run: pnpm test:vector-search
