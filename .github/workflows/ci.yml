          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://agentprodready_ci:agentprodready_ci@127.0.0.1:5432/agentprodready_ci
      RUN_POSTGRES_TESTS: "1"
      PERSISTENCE_PROVIDER: postgres
      EVALUATION_ENABLED: "true"
      EVALUATION_RESULT_STORE: persistent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Enable pnpm
        run: |
