name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    name: Verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.1 --activate
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Versioning integrity
        run: pnpm verify-versioning
      - name: Lint
        run: pnpm lint
      - name: Boundaries
        run: pnpm boundaries
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Tool calling tests
        run: pnpm test:tools
      - name: Routing tests
        run: pnpm test:routing
      - name: Tenant isolation
        run: pnpm test:tenant-isolation
      - name: Build
        run: pnpm build
      - name: Public DX (packed external install)
        run: pnpm test:public-dx
      - name: Scaffold DX (packed create-agentprodready)
        run: pnpm test:scaffold-dx
      - name: Smoke
        run: pnpm smoke

  docker:
    name: Docker image smoke
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Enable pnpm tooling for smoke script
        run: |
          corepack enable
          corepack prepare pnpm@10.15.1 --activate
      - name: Compute tags
        id: meta
        run: |
          VERSION="$(node -p "require('./apps/platform-host/package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
      - name: Build image
        run: |
          IMAGE=agentprodready/platform-host
          VERSION=${{ steps.meta.outputs.version }}
          SHA=${{ steps.meta.outputs.short_sha }}
          docker build \
            --build-arg PRODUCT_VERSION="$VERSION" \
            -t "$IMAGE:$VERSION" \
            -t "$IMAGE:$VERSION-$SHA" \
            -t "$IMAGE:sha-$SHA" \
            .
          if [ "${{ github.ref }}" = "refs/heads/main" ] || [ "${{ github.ref }}" = "refs/heads/master" ]; then
            docker tag "$IMAGE:$VERSION-$SHA" "$IMAGE:latest"
          fi
      - name: Run container
        run: |
          docker run --rm -d --name agentprodready-ci \
            -p 3000:3000 \
            -e HOST=0.0.0.0 \
            -e PORT=3000 \
            -e LOG_LEVEL=error \
            -e REFERENCE_AGENT_ENABLED=true \
            -e PERSISTENCE_PROVIDER=in-memory \
            -e AGENTPRODREADY_ALLOW_REFERENCE_AUTH=true \
            "agentprodready/platform-host:${{ steps.meta.outputs.version }}"
      - name: Docker smoke
        run: node scripts/docker-smoke.mjs http://127.0.0.1:3000
      - name: Stop container
        if: always()
        run: docker stop agentprodready-ci || true

  persistence-postgres:
    name: Persistence PostgreSQL
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: agentprodready_ci
          POSTGRES_PASSWORD: agentprodready_ci
          POSTGRES_DB: agentprodready_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentprodready_ci -d agentprodready_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://agentprodready_ci:agentprodready_ci@127.0.0.1:5432/agentprodready_ci
      RUN_POSTGRES_TESTS: "1"
      PERSISTENCE_ALLOW_RESET: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.1 --activate
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Migrate
        run: pnpm db:migrate
      - name: PostgreSQL tests
        run: pnpm test:postgres

  runtime-recovery-postgres:
    name: Runtime Recovery PostgreSQL
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: agentprodready_ci
          POSTGRES_PASSWORD: agentprodready_ci
          POSTGRES_DB: agentprodready_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentprodready_ci -d agentprodready_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://agentprodready_ci:agentprodready_ci@127.0.0.1:5432/agentprodready_ci
      RUN_POSTGRES_TESTS: "1"
      PERSISTENCE_PROVIDER: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.1 --activate
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Migrate
        run: pnpm db:migrate
      - name: Runtime recovery PostgreSQL tests
        run: pnpm test:runtime-recovery

  memory-persistence-postgres:
