# Default: single-service AgentProdReady (in-memory persistence).
# Optional PostgreSQL: docker compose --profile postgres up -d
#   then: pnpm db:migrate
#   then: PERSISTENCE_PROVIDER=postgres DATABASE_URL=postgres://agentprodready:agentprodready@127.0.0.1:5432/agentprodready pnpm start

services:
  agentprodready:
    build:
      context: .
      dockerfile: Dockerfile
    image: agentprodready/platform-host:1.0.0
    ports:
      - "3000:3000"
    environment:
      HOST: "0.0.0.0"
      PORT: "3000"
      LOG_LEVEL: "info"
      REFERENCE_AGENT_ENABLED: "true"
      PERSISTENCE_PROVIDER: "in-memory"
      RUNTIME_RECOVERY_ENABLED: "false"
      MEMORY_PROVIDER: "in-memory"
      AGENTPRODREADY_ALLOW_REFERENCE_AUTH: "true"
      AI_ROUTING_MODE: "fixed"

  postgres:
    profiles: ["postgres"]
    # pgvector-enabled Postgres 16 (serves persistence + vector migrations)
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: agentprodready
      POSTGRES_PASSWORD: agentprodready
      POSTGRES_DB: agentprodready
    ports:
      - "5432:5432"
    volumes:
      - agentprodready_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentprodready -d agentprodready"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  agentprodready_pg:
